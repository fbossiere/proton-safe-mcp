# The Inno Setup compiler this project builds its installer with.
#
# Pinned, and verified by its digest before it is run, because the compiler decides how
# the uninstaller is produced, how the architecture directives are enforced and how the
# signing tool is invoked. None of that may change between two releases without someone
# deciding that it should.
#
# What was verified, on 14 September 2026, and how:
#
#   1. https://jrsoftware.org/isdl.php links Inno Setup 7.1.0 to the two files below,
#      hosted on the project's own GitHub release. There is no such download under
#      files.jrsoftware.org; that path returns 404.
#   2. The file was fetched over HTTPS from that release and its SHA-256 computed.
#   3. The publisher ships innosetup-7.1.0-x64.exe.issig beside it, which records
#      file-size 14304168 and file-hash 0362a383… in plain text under its own signature.
#      Both match the file that was downloaded, byte count included.
#
# What was NOT verified, and is left for the machine that builds the release:
#
#   * the ECDSA signature inside the .issig, which needs the publisher's key and
#     ISSigTool, a Windows program;
#   * the Authenticode signature on the executable. Per
#     https://jrsoftware.org/isdl-verify.php it must read "Pyrsys B.V." — not
#     "Jordan Russell", who is the author and copyright holder but not the signer, and
#     not "Open Source Developer, Martijn Laan", which is what releases before 6.4.2
#     carried. Confirm this on Windows before the first signed release.
#
# To move to a new version, repeat all of the above rather than editing the digest.

version = 7.1.0
