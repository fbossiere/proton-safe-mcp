# The Inno Setup compiler this project builds its installer with.
#
# Pinned, and verified by its digest before it is run, because the compiler decides how
# the uninstaller is produced, how the architecture directives are enforced and how the
# signing tool is invoked. None of that may change between two releases without someone
# deciding that it should.
#
# sha256 is deliberately left unset. Filling it in means someone downloaded this exact
# file from jrsoftware.org, checked the publisher's signature on it, and recorded what
# they actually got. A digest copied from anywhere else would verify nothing, so the
# build refuses to run rather than accept a guess.
#
# To pin it:
#     1. download the URL below on a machine you trust;
#     2. confirm the file's Authenticode signature names Jordan Russell;
#     3. record its SHA-256 here, and note the date in docs/windows-acceptance.md.

version = 7.1.0
url = https://files.jrsoftware.org/is/7/innosetup-7.1.0.exe
sha256 =
