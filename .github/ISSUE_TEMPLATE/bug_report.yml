name: Bug report
description: Report a defect in proton-safe-mcp
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** Use GitHub private
        vulnerability reporting instead (see SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Clear description of the bug, with the exact error message if any.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `proton-safe-mcp serve` with ...
        2. Call the `...` tool with ...
        3. Observe ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: proton-safe-mcp version
      placeholder: "0.1.0"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Ubuntu 24.04, Python 3.12, Proton Bridge 3.x, MCP client name"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Redact email addresses, message content, and anything sensitive.
      render: text
