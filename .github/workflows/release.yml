name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (for example, v1.1.0)
        required: true
        type: string
      registry_only:
        description: Republish only MCP Registry metadata from the selected branch
        required: false
        default: false
        type: boolean
      include_windows:
        description: >-
          Build, sign and publish the Windows installer with this release. Leave off
          until a Windows client is qualified and a signing identity works in CI; a
          release that claims Windows must not ship an unsigned or unverified one.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify distributions
    if: ${{ !inputs.registry_only && startsWith(inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
          enable-cache: false
      - name: Verify release versions agree
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          PACKAGE_VERSION=$(uv run --no-project python -c 'import pathlib, re; text = pathlib.Path("src/proton_safe_mcp/__init__.py").read_text(); print(re.search(r"__version__ = \"([^\"]+)\"", text).group(1))')
          REGISTRY_VERSION=$(jq -r .version server.json)
          test "$RELEASE_TAG" = "v$PACKAGE_VERSION"
          test "$REGISTRY_VERSION" = "$PACKAGE_VERSION"
          test "$(jq -r '.packages[0].version' server.json)" = "$PACKAGE_VERSION"
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libglib2.0-0t64
      - run: uv sync --frozen --extra dev --extra docs --extra desktop
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pip-audit
      - run: uv build --no-sources
      - run: QT_QPA_PLATFORM=offscreen uv run pytest --cov
      - name: Require usable Qt for interface coverage
        run: QT_QPA_PLATFORM=offscreen uv run python -c "import PySide6.QtWidgets"
      - run: uv run mkdocs build --strict
      - run: uvx --from twine twine check dist/*
      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-distributions
          path: dist/
          if-no-files-found: error

  build-desktop:
    name: Desktop package (Ubuntu 24.04)
    if: ${{ !inputs.registry_only && startsWith(inputs.tag, 'v') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
      # Qt's xcb platform plugin resolves these from the system, which is also what the
      # package declares in Depends; installing them here lets the build validate them.
      - name: Install the Qt platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3
      - run: uv sync --frozen --extra dev --extra desktop --extra packaging
      - name: Build the bundle
        run: PYINSTALLER="$(pwd)/.venv/bin/pyinstaller" bash packaging/build_bundle.sh
      - name: Build the package
        run: bash packaging/build_deb.sh
      - name: Build the wheel
        run: uv build --no-sources
      # Runs the package-level tests, which are skipped when no artefact exists.
      - name: Verify the built artefacts
        run: QT_QPA_PLATFORM=offscreen uv run pytest tests/test_desktop_package.py -q
      - name: Check the assistant starts headless
        run: QT_QPA_PLATFORM=offscreen uv run pytest tests/test_desktop_app.py -q
      - name: Show the artefact provenance
        run: cat dist/desktop/BUILD-PROVENANCE.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-package
          path: |
            dist/desktop/*.deb
            dist/desktop/*.deb.sha256
            dist/desktop/BUILD-PROVENANCE.txt
          if-no-files-found: error

  publish-desktop:
    name: Attach Ubuntu installer to draft release
    needs: [build, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write # Attach only the artefacts produced from the release tag.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: desktop-package
          path: desktop/
      - name: Verify and attach the installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd desktop
          sha256sum --check --strict ./*.deb.sha256
          # Immutable releases reject new assets after publication. Upload while draft.
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$RELEASE_TAG" ./*.deb ./*.deb.sha256 BUILD-PROVENANCE.txt

  build-windows:
    name: Windows installer (Windows 11 x64)
    if: ${{ !inputs.registry_only && inputs.include_windows && startsWith(inputs.tag, 'v') }}
    runs-on: windows-latest
    environment:
      # Holds the signing credentials. Pull requests never reach this environment, so an
      # untrusted build can neither sign nor publish anything.
      name: windows-signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
      - run: uv sync --frozen --extra dev --extra desktop --extra packaging
      # Windows is a supported platform for this release, so its tests are part of the
      # gate, not a separate opinion gathered afterwards.
      - name: Run the test suite on Windows
        run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      - name: Install the pinned Inno Setup
        run: uv run python packaging/windows/fetch_innosetup.py --install
      - name: Build, verify, sign and package
        env:
          # A command line with Inno Setup's $f placeholder for the file to sign. No key
          # material is ever in this repository or in an artefact; the secret names a
          # signing service the runner is authorised to call.
          PROTON_SAFE_SIGN_COMMAND: ${{ secrets.WINDOWS_SIGN_COMMAND }}
        run: |
          $env:PYINSTALLER = "$PWD\.venv\Scripts\pyinstaller.exe"
          $env:PROTON_SAFE_PYTHON = "$PWD\.venv\Scripts\python.exe"
          pwsh packaging/windows/build_windows.ps1
      # A release that announces Windows must not ship a build nobody can attribute.
      # The build script names an unsigned artefact "-unsigned"; this refuses it outright.
      - name: Refuse an unsigned release artefact
        run: |
          $unsigned = Get-ChildItem dist/windows -Filter "*-unsigned.exe" -ErrorAction SilentlyContinue
          if ($unsigned) {
            throw "This release is unsigned. Configure WINDOWS_SIGN_COMMAND, or release without include_windows."
          }
          $installer = Get-ChildItem dist/windows -Filter "ProtonSafe-Setup-*.exe" | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          if ($signature.Status -ne "Valid") { throw "signature status is $($signature.Status)" }
          Write-Host "Signed by $($signature.SignerCertificate.Subject)"
      - name: Verify the installer installs and uninstalls unattended
        run: pwsh packaging/windows/test_standard_account.ps1
      - name: Show the artefact provenance
        run: Get-Content dist/windows/BUILD-PROVENANCE-windows-x64.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            dist/windows/ProtonSafe-Setup-*.exe
            dist/windows/ProtonSafe-Setup-*.exe.sha256
            dist/windows/BUILD-PROVENANCE-windows-x64.txt
            dist/windows/SBOM-windows-x64.json
          if-no-files-found: error

  publish-windows:
    name: Attach Windows installer to draft release
    needs: [build, build-desktop, build-windows]
    if: ${{ !inputs.registry_only && inputs.include_windows && startsWith(inputs.tag, 'v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write # Attach only the artefacts produced from the release tag.
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-installer
          path: windows/
      - name: Verify and attach the installer
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          cd windows
          # The digest was taken after signing, so this checks the file that ships.
          sha256sum --check --strict ./*.exe.sha256
          # Immutable releases reject new assets after publication. Upload while draft.
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = true
          # These names sit alongside the Ubuntu ones; neither overwrites the other.
          gh release upload "$RELEASE_TAG" ./ProtonSafe-Setup-*.exe \
            ./ProtonSafe-Setup-*.exe.sha256 \
            BUILD-PROVENANCE-windows-x64.txt SBOM-windows-x64.json

  publish-pypi:
    name: Publish to PyPI
    # A release that announces Windows must not publish its Python package while the
    # Windows build is failing: the version would exist with no installer behind it.
    needs: [build, build-desktop, build-windows]
    if: ${{ always() && needs.build.result == 'success' && needs.build-desktop.result == 'success' && (needs.build-windows.result == 'success' || !inputs.include_windows) }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/proton-safe-mcp
    permissions:
      id-token: write # PyPI trusted publishing; no long-lived API token is used.
    steps:
      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-distributions
          path: dist/
      - name: Publish distributions with OIDC
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  publish-mcp-registry:
    name: Publish to MCP Registry
    needs: [build, publish-pypi]
    if: >-
      ${{
        always() &&
        (
          needs.publish-pypi.result == 'success' ||
          (github.event_name == 'workflow_dispatch' && inputs.registry_only)
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # MCP Registry GitHub OIDC authentication.
    env:
      MCP_PUBLISHER_VERSION: "1.8.1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.registry_only && github.sha || inputs.tag }}
      - name: Verify registry metadata version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(jq -r .version server.json)"
          test "$(jq -r '.packages[0].version' server.json)" = "${RELEASE_TAG#v}"
      - name: Install verified MCP publisher
        run: |
          curl --fail --location --silent --show-error \
            --output mcp-publisher_linux_amd64.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            --output checksums.txt \
            "https://github.com/modelcontextprotocol/registry/releases/download/v${MCP_PUBLISHER_VERSION}/registry_${MCP_PUBLISHER_VERSION}_checksums.txt"
          grep 'mcp-publisher_linux_amd64.tar.gz$' checksums.txt | sha256sum --check --strict
          tar --extract --gzip --no-same-owner \
            --file mcp-publisher_linux_amd64.tar.gz mcp-publisher
      - name: Authenticate with GitHub OIDC
        run: ./mcp-publisher login github-oidc
      - name: Validate server metadata
        run: ./mcp-publisher validate
      - name: Publish server metadata
        run: ./mcp-publisher publish

  publish-github:
    name: Publish completed GitHub Release
    needs: [publish-desktop, publish-windows, publish-mcp-registry]
    # The release is published once every artefact it announces is attached. The Windows
    # clause is written against the input, not against a skipped result: publish-windows
    # is also skipped when build-windows fails, so accepting "skipped" would publish a
    # release claiming Windows while its installer failed to build.
    if: >-
      ${{
        always() &&
        needs.publish-desktop.result == 'success' &&
        needs.publish-mcp-registry.result == 'success' &&
        (needs.publish-windows.result == 'success' || !inputs.include_windows)
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish after all distributions and metadata are ready
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: gh release edit "$RELEASE_TAG" --draft=false --latest
