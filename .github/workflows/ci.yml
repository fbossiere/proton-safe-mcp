name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
      # The desktop package is type-checked too, so Qt must be installed here.
      - run: uv sync --frozen --extra dev --extra desktop
      - run: uv run mypy

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          version: "latest-known"
      # Qt's offscreen platform needs no display but still loads these system libraries.
      # Without them the interface tests would skip, and a green run would prove nothing.
      - name: Install the Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libegl1 libglib2.0-0t64
      - run: uv sync --frozen --extra dev --extra desktop
      - run: QT_QPA_PLATFORM=offscreen uv run pytest --cov --cov-report=term-missing
      # A module-level skip still exits 0, so assert directly that Qt was usable here.
      # Without this, losing a system library would turn the interface tests into a
      # silent skip and the run would stay green while proving nothing.
      - name: Fail if Qt was not usable for the interface tests
        run: QT_QPA_PLATFORM=offscreen uv run python -c "import PySide6.QtWidgets"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
      - run: uv sync --frozen --extra dev --extra docs
      - run: uv run pip-audit

  build:
    name: Build distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
      - run: uv build --no-sources
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  desktop:
    name: Desktop package (Ubuntu 24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
      # Qt's xcb platform plugin resolves these from the system, which is also what the
      # package declares in Depends; installing them here lets the build validate them.
      - name: Install the Qt platform dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            libegl1 libfontconfig1 libfreetype6 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 \
            libxcb-xkb1 libdbus-1-3
      - run: uv sync --frozen --extra dev --extra desktop --extra packaging
      - name: Build the bundle
        run: PYINSTALLER="$(pwd)/.venv/bin/pyinstaller" bash packaging/build_bundle.sh
      - name: Build the package
        run: bash packaging/build_deb.sh
      - name: Build the wheel
        run: uv build --no-sources
      # Runs the package-level tests, which are skipped when no artefact exists.
      - name: Verify the built artefacts
        run: QT_QPA_PLATFORM=offscreen uv run pytest tests/test_desktop_package.py -q
      - name: Check the assistant starts headless
        run: QT_QPA_PLATFORM=offscreen uv run pytest tests/test_desktop_app.py -q
      - name: Show the artefact provenance
        run: cat dist/desktop/BUILD-PROVENANCE.txt
      # Deliberately upload only. Publishing a release stays a separate, manual decision.
      # The package is never committed; this artefact is how a tester obtains it, together
      # with the source commit and the SHA-256 needed to verify what they downloaded.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-package
          path: |
            dist/desktop/*.deb
            dist/desktop/*.deb.sha256
            dist/desktop/BUILD-PROVENANCE.txt
          if-no-files-found: error

  windows-tests:
    name: Tests (Windows 11 x64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
      - run: uv sync --frozen --extra dev --extra desktop
      # The whole suite runs here, not a hand-picked subset. Only the tests whose
      # subject is a Unix guarantee — a mode, a uid, a symlink — are marked posix_only
      # and skip themselves; their Windows equivalents are in test_platform_services.py
      # and test_windows_behaviour.py and do run, on both systems.
      - run: uv run pytest -q
        env:
          QT_QPA_PLATFORM: offscreen
      # A module-level skip still exits 0, so assert directly that Qt was usable here.
      - name: Fail if Qt was not usable for the interface tests
        run: uv run python -c "import PySide6.QtWidgets"
      # Proves the Windows platform services are the ones this process resolved, so a
      # green run cannot come from silently exercising the POSIX implementation.
      - name: Confirm the Windows platform services are in use
        run: >
          uv run python -c "from proton_safe_mcp.platform_services import services;
          assert services().name == 'windows', services().name;
          print('platform services:', services().name)"

  windows-package:
    name: Windows installer (Windows 11 x64)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
          version: "latest-known"
      - run: uv sync --frozen --extra dev --extra desktop --extra packaging
      - name: Verify and install the pinned Inno Setup
        run: uv run python packaging/windows/fetch_innosetup.py --install
      - name: Build and verify the installer
        run: |
          $env:PYINSTALLER = "$PWD\.venv\Scripts\pyinstaller.exe"
          $env:PROTON_SAFE_PYTHON = "$PWD\.venv\Scripts\python.exe"
          pwsh packaging/windows/build_windows.ps1
      - name: Install, repair and uninstall as a standard account
        run: pwsh packaging/windows/test_standard_account.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-installer
          path: |
            dist/windows/ProtonSafe-Setup-*.exe
            dist/windows/ProtonSafe-Setup-*.exe.sha256
            dist/windows/BUILD-PROVENANCE-windows-x64.txt
            dist/windows/SBOM-windows-x64.json
          if-no-files-found: error
