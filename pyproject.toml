[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "proton-safe-mcp"
dynamic = ["version"]
description = "Client-agnostic Proton Mail MCP server with safe reads, bounded attachment text extraction, and explicitly confirmed drafts"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Francois Bossiere" }]
keywords = ["mcp", "proton", "protonmail", "proton-bridge", "imap", "llm", "ai-agents", "security"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Communications :: Email",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "fastmcp==3.4.7",
  "keyring>=25.6,<26",
  "pypdf>=6.1,<7",
]

[project.urls]
Homepage = "https://github.com/fbossiere/proton-safe-mcp"
Repository = "https://github.com/fbossiere/proton-safe-mcp"
Issues = "https://github.com/fbossiere/proton-safe-mcp/issues"
Documentation = "https://fbossiere.github.io/proton-safe-mcp/"
Changelog = "https://github.com/fbossiere/proton-safe-mcp/blob/main/CHANGELOG.md"
Security = "https://github.com/fbossiere/proton-safe-mcp/blob/main/SECURITY.md"

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<0.17",
  "mypy>=1.14,<3",
  "pip-audit>=2.9,<3",
]
docs = [
  "mkdocs-material>=9.6,<10",
]
# Desktop assistant only. The MCP server, its CLI and the whole test suite run
# without Qt, so PyPI users of the server never pull these in.
desktop = [
  "PySide6-Essentials>=6.7,<7",
]
packaging = [
  "pyinstaller>=6.10,<8",
]

[project.scripts]
proton-safe-mcp = "proton_safe_mcp.cli:main"

[project.gui-scripts]
proton-safe-assistant = "proton_safe_mcp.desktop.app:main"

[tool.hatch.version]
path = "src/proton_safe_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/proton_safe_mcp"]

# The plugin resources ship inside the wheel so the assistant renders a managed plugin
# from the exact revision it was built with. Nothing is fetched from `main` at install time.
[tool.hatch.build.targets.wheel.force-include]
"plugins/proton-safe" = "proton_safe_mcp/plugin_resources"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/packaging",
  "/plugins",
  "/.agents",
  "/.github",
  "/docs",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/glama.json",
  "/LICENSE",
  "/llms-install.md",
  "/mkdocs.yml",
  "/README.md",
  "/SECURITY.md",
  "/server.json",
  "/pyproject.toml",
  "/uv.lock",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["proton_safe_mcp"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "C4", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S108"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src/proton_safe_mcp"]

[[tool.mypy.overrides]]
module = "fastmcp.*"
follow_untyped_imports = true
