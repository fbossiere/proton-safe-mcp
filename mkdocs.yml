site_name: Proton Safe MCP
site_url: https://fbossiere.github.io/proton-safe-mcp/
site_description: Safe, draft-only Proton Mail access for MCP clients
repo_url: https://github.com/fbossiere/proton-safe-mcp
repo_name: fbossiere/proton-safe-mcp
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Francois Bossiere

theme:
  name: material
  custom_dir: docs/overrides
  font: false
  logo: assets/proton-safe.svg
  favicon: assets/proton-safe.svg
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Download: download.md
  - First try & feedback: try-it.md
  - En français:
      - Accueil: fr/index.md
      - Télécharger: fr/telecharger.md
      - Essayer et donner son avis: fr/essayer.md
  - Project overview: overview.md
  - Getting started: getting-started.md
  - Desktop assistant: desktop-assistant.md
  - Client setup: clients.md
  - OpenAI plugin: openai-plugin.md
  - External testing: external-testing.md
  - Desktop validation: desktop-testing.md
  - Desktop acceptance sheet: desktop-acceptance.md
  - User guide:
      - Configuration: configuration.md
      - MCP tools: mcp-tools.md
      - Received attachment extraction: received-attachments.md
      - Outgoing attachments: attachments.md
  - Security model: security-model.md
  - FAQ: faq.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
  - Releasing: releasing.md
  - Launch checklist: launch.md
  - Changelog: https://github.com/fbossiere/proton-safe-mcp/blob/main/CHANGELOG.md

# Keep templates out of generated pages. All public assets are self-hosted.
exclude_docs: |
  /overrides/
extra:
  desktop_release:
    version: "2.1.2"
    url: https://github.com/fbossiere/proton-safe-mcp/releases/download/v2.1.2/proton-safe-assistant_2.1.2_amd64.deb
