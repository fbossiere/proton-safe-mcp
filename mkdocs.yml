site_name: Proton Safe MCP
site_url: https://fbossiere.github.io/proton-safe-mcp/
site_description: Safe, draft-only Proton Mail access for MCP clients
repo_url: https://github.com/fbossiere/proton-safe-mcp
repo_name: fbossiere/proton-safe-mcp
edit_uri: edit/main/docs/
copyright: Copyright &copy; 2026 Francois Bossiere

theme:
  name: material
  language: en
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Client setup: clients.md
  - User guide:
      - Configuration: configuration.md
      - MCP tools: mcp-tools.md
      - Attachments: attachments.md
      - Draft approval: draft-approval.md
  - Security model: security-model.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
  - Releasing: releasing.md
  - Changelog: https://github.com/fbossiere/proton-safe-mcp/blob/main/CHANGELOG.md
